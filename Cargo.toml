[workspace]
resolver = "2"
members = [
    "crates/forge",
    "crates/forge-terminal",
    "crates/forge-workspace",
    "crates/forge-files",
    "crates/forge-editor",
    "crates/forge-git",
    "crates/forge-proc",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds of a GPUI app are dramatically slower than release; keep the
# dependency graph optimized even in dev so `cargo run` stays usable.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
gpui = "0.2"
portable-pty = "0.8"
vt100 = "0.15"
anyhow = "1"
libc = "0.2"
