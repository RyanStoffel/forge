name: Edge release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: edge-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS edge release
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      FORGE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS binaries
        run: |
          cargo build --locked --release -p forge --target aarch64-apple-darwin
          cargo build --locked --release -p forge --target x86_64-apple-darwin
      - name: Prepare release assets
        run: |
          version="$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | head -n 1)"
          mkdir -p dist package/aarch64 package/x86_64
          cp target/aarch64-apple-darwin/release/forge dist/forge-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/forge dist/forge-x86_64-apple-darwin
          FORGE_BINARY=target/aarch64-apple-darwin/release/forge \
            FORGE_VERSION="$version" FORGE_REVISION="$GITHUB_SHA" \
            OUTPUT_DIR=package/aarch64 bash scripts/package-macos-app.sh
          FORGE_BINARY=target/x86_64-apple-darwin/release/forge \
            FORGE_VERSION="$version" FORGE_REVISION="$GITHUB_SHA" \
            OUTPUT_DIR=package/x86_64 bash scripts/package-macos-app.sh
          ditto -c -k --sequesterRsrc --keepParent package/aarch64/Forge.app dist/Forge-aarch64-apple-darwin.zip
          ditto -c -k --sequesterRsrc --keepParent package/x86_64/Forge.app dist/Forge-x86_64-apple-darwin.zip
          for asset in dist/forge-*-apple-darwin dist/Forge-*-apple-darwin.zip; do
            shasum -a 256 "$asset" > "$asset.sha256"
          done
      - name: Publish edge releases
        run: |
          version="$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          immutable_tag="forge-app-$version-edge.$short_sha"
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --target "$GITHUB_SHA" --title "Forge Edge" --notes "Automated edge build from $GITHUB_SHA."
            gh release upload edge dist/* --clobber
          else
            gh release create edge dist/* --prerelease --target "$GITHUB_SHA" --title "Forge Edge" --notes "Automated edge builds from main."
          fi
          gh release create "$immutable_tag" dist/Forge-* --prerelease --target "$GITHUB_SHA" \
            --title "Forge Edge $short_sha" --notes "Immutable app artifacts for Homebrew."

  tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Download published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download edge --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir dist
      - name: Read release metadata
        id: release
        run: |
          {
            echo "version=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | head -n 1)"
            echo "binary_arm64_sha256=$(cut -d ' ' -f 1 dist/forge-aarch64-apple-darwin.sha256)"
            echo "binary_x86_64_sha256=$(cut -d ' ' -f 1 dist/forge-x86_64-apple-darwin.sha256)"
            echo "app_arm64_sha256=$(cut -d ' ' -f 1 dist/Forge-aarch64-apple-darwin.zip.sha256)"
            echo "app_x86_64_sha256=$(cut -d ' ' -f 1 dist/Forge-x86_64-apple-darwin.zip.sha256)"
          } >> "$GITHUB_OUTPUT"
      - name: Generate Homebrew artifacts
        env:
          FORGE_REVISION: ${{ github.sha }}
          FORGE_VERSION: ${{ steps.release.outputs.version }}
          ARM64_SHA256: ${{ steps.release.outputs.binary_arm64_sha256 }}
          X86_64_SHA256: ${{ steps.release.outputs.binary_x86_64_sha256 }}
          FORMULA_PATH: generated/forge.rb
          CASK_PATH: generated/forge-app.rb
        run: |
          mkdir -p generated
          bash scripts/update-homebrew-formula.sh
          ARM64_SHA256="${{ steps.release.outputs.app_arm64_sha256 }}" \
            X86_64_SHA256="${{ steps.release.outputs.app_x86_64_sha256 }}" \
            bash scripts/update-homebrew-cask.sh
      - name: Publish Homebrew artifacts through GitHub
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          publish_file() {
            local source="$1"
            local destination="$2"
            local current_sha
            current_sha="$(gh api "repos/RyanStoffel/homebrew-forge/contents/$destination" --jq .sha 2>/dev/null || true)"
            jq -n \
              --arg message "forge: update edge to ${GITHUB_SHA::7}" \
              --arg content "$(base64 -w 0 "$source")" \
              --arg sha "$current_sha" \
              'if $sha == "" then {message: $message, content: $content} else {message: $message, content: $content, sha: $sha} end' \
              > artifact-update.json
            gh api "repos/RyanStoffel/homebrew-forge/contents/$destination" \
              --method PUT \
              --input artifact-update.json
          }
          publish_file generated/forge.rb Formula/forge.rb
          publish_file generated/forge-app.rb Casks/forge-app.rb
