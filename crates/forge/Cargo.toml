[package]
name = "forge"
edition.workspace = true
version.workspace = true
publish = false

[features]
cargo-clippy = []

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
forge-terminal = { path = "../forge-terminal" }
forge-workspace = { path = "../forge-workspace" }
forge-files = { path = "../forge-files" }
forge-editor = { path = "../forge-editor" }
forge-git = { path = "../forge-git" }
forge-proc = { path = "../forge-proc" }
vt100 = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
security-framework = "3"
